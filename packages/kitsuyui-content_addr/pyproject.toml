[project]
name = "kitsuyui.content_addr"
dynamic = ["version"]
description = "A playground for publishing packages to PyPI"
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    {name = "Yui KITSU", email = "kitsuyui+github@kitsuyui.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "kitsuyui-fileio>=0.8.1",
]

[project.urls]
Homepage = "https://github.com/kitsuyui/pypi-playground"

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
package-data = { "*" = ["README.md", "LICENSE", "py.typed", "*.pyi"] }

[tool.setuptools.packages.find]
where = ["src/"]
include = ["kitsuyui.content_addr"]

[tool.setuptools_scm]
version_file = "./src/kitsuyui/content_addr/_version.py"
root = "../.."

[dependency-groups]
dev = [
    "dev-shared",
]

[tool.uv.sources]
dev-shared = { workspace = true }
kitsuyui-fileio = { workspace = true }

[tool.mypy]
mypy_path = ["src", "../kitsuyui-fileio/src"]

[tool.poe]
include = "../../dev-shared/poe.tasks.toml"

[tool.poe.tasks.type_check]
sequence = [
    { cmd = "env MYPYPATH=src mypy --namespace-packages --explicit-package-bases src tests" },
    { cmd = "ty check src tests --extra-search-path ../kitsuyui-fileio/src" },
]
