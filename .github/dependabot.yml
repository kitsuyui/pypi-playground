version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    allow:
      - dependency-type: "all"
    groups:
      uv-dependencies:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
