name: Packaging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish as kitsuyui.fileio"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  python_version: 3.13

permissions:
  contents: read

jobs:
  validate-packages:
    if: github.event_name != 'workflow_dispatch' || (github.ref_type == 'tag' && inputs.tag == github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.python_version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: |
          uv sync --locked
          uv run poe sync-all
          for package in kitsuyui-animal kitsuyui-content_addr kitsuyui-fileio kitsuyui-hello; do
            uv build --package "$package" --out-dir "packages/$package/dist"
          done
      - name: Verify release versions
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --with packaging python scripts/verify_release_artifacts.py "$RELEASE_TAG"

  deploy:
    needs: validate-packages
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.tag == github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["kitsuyui-fileio"]') || fromJSON('["kitsuyui-animal", "kitsuyui-content_addr", "kitsuyui-fileio", "kitsuyui-hello"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv run poe sync-all

      - name: Build
        run: uv build --package "${{ matrix.targets }}" --out-dir "packages/${{ matrix.targets }}/dist"

      - name: Verify manually selected release tag and version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "tag must start with v" >&2; exit 1 ;;
          esac
          test "$RELEASE_TAG" = "$EVENT_TAG"
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(uv run --package kitsuyui-fileio python -c 'from kitsuyui.fileio import __version__; print(__version__)')"
          test "$actual_version" = "$expected_version"

      - name: Publish distribution to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: github.event_name == 'release' && github.event.release.prerelease
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/${{ matrix.targets }}/dist

      - name: Publish distribution to PyPI
        if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: packages/${{ matrix.targets }}/dist
          attestations: true
