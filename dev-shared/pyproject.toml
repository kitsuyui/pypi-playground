[project]
name = "dev-shared"
dynamic = ["version"]
description = "dev-shared"
classifiers = [
    "Private :: Do Not Upload",
]
requires-python = ">=3.10"

dependencies = [
    "pytest>=9.1.1,<10",
    "pytest-mock>=3.16.0,<4",
    "pytest-cov>=7,<8",
    "poethepoet>=0.48.0,<1",
    "setuptools-scm>=10.3.4,<11",
    "ruff>=0.16.10,<1",
    "mypy>=2.4.0,<3",
    "ty>=0.0.84,<0.1",
]
